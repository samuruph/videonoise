[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videonoise"
version = "0.1.0"
description = "Analysis of noise initialization in video diffusion models"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "matplotlib",
    "tqdm",
    "imageio",
    "imageio-ffmpeg",
    "pyyaml",
]

[project.optional-dependencies]
diffusion = ["diffusers>=0.26", "transformers", "accelerate", "tiktoken", "sentencepiece", "protobuf", "tokenizers"]
analysis  = ["umap-learn", "lpips", "clean-fid"]
dev       = ["jupyter", "ipykernel", "pytest"]

[project.scripts]
vn-download   = "videonoise.scripts.download_data:main"
vn-generate   = "videonoise.scripts.generate_videos:main"
vn-metrics    = "videonoise.scripts.compute_metrics:main"
vn-inversion  = "videonoise.scripts.noise_inversion:main"
vn-stanalysis = "videonoise.scripts.spatiotemporal_analysis:main"
vn-compare    = "videonoise.scripts.compare_results:main"
vn-viz        = "videonoise.scripts.viz_metrics:main"
vn-ablation   = "videonoise.scripts.noise_ablation:main"
vn-noise-init = "videonoise.noise.generators:_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["videonoise*"]
